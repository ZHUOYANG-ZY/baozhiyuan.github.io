<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>志愿填报信息表</title>
    <!-- PDF导出依赖库（代码保留，按钮已移除） -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        /* 全局重置 - 经典扁平化基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333333;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: normal;
        }

        /* 顶部按钮组 */
        .btn-group {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        /* 通用按钮样式：纯扁平、无阴影、纯色块 */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            flex: 0 0 auto;
            transition: background-color 0.2s ease;
        }
        .btn-clear { background-color: #f39c12; color: #fff; }
        .btn-clear:hover { background-color: #e67e22; }
        .btn-print { background-color: #2980b9; color: #fff; }
        .btn-print:hover { background-color: #2471a3; }
        .btn-export { background-color: #16a085; color: #fff; }
        .btn-export:hover { background-color: #138d75; }
        .btn-delete { background-color: #e74c3c; color: #fff; }
        .btn-delete:hover { background-color: #c0392b; }
        /* 新增分享按钮样式 */
        .btn-share { background-color: #9b59b6; color: #fff; }
        .btn-share:hover { background-color: #8e44ad; }

        /* 学校移动按钮 */
        .btn-move {
            padding: 8px 12px;
            font-size: 14px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-move:hover { background-color: #2980b9; }
        .btn-move:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* 专业移动小按钮 */
        .pro-btn {
            padding: 6px 8px;
            font-size: 14px;
            border: none;
            border-radius: 3px;
            background-color: #27ae60;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .pro-btn:hover { background-color: #219653; }
        .pro-btn:disabled { background-color: #bdc3c7; }

        /* 学校卡片：扁平化核心 */
        .school-card {
            background-color: #ffffff;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }
        /* 卡片头部栏 扁平纯色 */
        .card-header {
            background-color: #34495e;
            color: #ffffff;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .card-header h3 {
            font-size: 18px;
            font-weight: normal;
        }
        .button-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 15px;
        }
        /* 表格：经典扁平细线条边框 */
        table {
            width: 100%;
            min-width: 320px;
            border-collapse: collapse;
            border: 1px solid #999;
        }
        td {
            border: 1px solid #999;
            padding: 12px 8px;
            vertical-align: middle;
            font-size: 16px;
            color: #333;
        }
        td:nth-child(1) { width: 22%; text-align: center; }
        td:nth-child(2) { width: 26%; }
        td:nth-child(3) { width: 22%; text-align: center; }
        td:nth-child(4) { width: 30%; }

        /* 输入框：无下划线 */
        input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #333;
        }
        input::placeholder {
            color: #999;
            font-size: 15px;
        }

        /* 底部添加学校按钮 */
        .add-school-wrapper {
            text-align: center;
            margin: 20px 0;
        }
        .btn-add-school {
            background-color: #27ae60;
            color: #fff;
            width: 220px;
            padding: 14px 0;
            font-size: 17px;
        }
        .btn-add-school:hover {
            background-color: #219653;
        }
        .btn-add-school:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* 打印样式 */
        @media print {
            body { background: white; padding: 0; }
            .btn-group, .button-container, .pro-btn, .add-school-wrapper { display: none !important; }
            .school-card { border: none; }
        }
        #schoolTemplate { display: none; }

        /* ========== 手机端适配（同步扁平化） ========== */
        @media (max-width: 768px) {
            body { padding: 5px; }
            h1 { font-size: 26px; margin: 10px 0; }
            .btn-group {
                flex-direction: column;
                gap: 8px;
                padding: 0 5px;
            }
            .btn {
                width: 100%;
                padding: 18px 0;
                font-size: 18px;
                border-radius: 4px;
            }
            .btn-add-school {
                width: 100%;
                padding: 20px 0;
                font-size: 20px;
            }
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 15px 10px;
            }
            .card-header h3 {
                font-size: 20px;
                width: 100%;
            }
            .button-container {
                width: 100%;
                justify-content: space-between;
            }
            .btn-move, .btn-delete {
                flex: 1;
                padding: 12px 0;
                font-size: 16px;
                text-align: center;
            }
            .table-wrapper { padding: 10px 5px; }
            td {
                padding: 15px 5px;
                font-size: 18px;
            }
            input {
                font-size: 18px;
            }
            input::placeholder {
                font-size: 16px;
            }
            .pro-btn {
                padding: 10px 5px;
                font-size: 16px;
                width: 100%;
                margin: 2px 0;
                border-radius: 3px;
            }
        }

        /* 导出文档专用两列布局样式 */
        .two-columns {
            column-count: 2;
            column-gap: 20px;
            column-fill: auto;
            width: 100%;
        }
        .two-columns .school-item {
            break-inside: avoid;
            margin-bottom: 20px;
        }
        /* PDF导出静态文本 */
        .static-text {
            font-size: 16px;
            color: #333;
            width: 100%;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <h1>志愿填报信息表</h1>
    
    <!-- 顶部按钮组：新增分享按钮 -->
    <div class="btn-group">
        <button class="btn btn-clear" onclick="clearAllSchools()">清空所有</button>
        <button class="btn btn-print" onclick="exportPrint()">导出打印</button>
        <button class="btn btn-export" onclick="exportAsWord()">导出 Word</button>
        <button class="btn btn-share" onclick="shareData()">分享链接</button>
    </div>

    <!-- 学校列表 -->
    <div id="schoolList"></div>

    <!-- 添加学校按钮（底部） -->
    <div class="add-school-wrapper">
        <button id="addSchoolBtn" class="btn btn-add-school" onclick="addSchool()">+ 添加学校</button>
    </div>

    <!-- 学校模板 -->
    <div id="schoolTemplate" class="school-card">
        <div class="card-header">
            <h3 class="school-title">第 1 所学校</h3>
            <div class="button-container">
                <button class="btn btn-move" onclick="moveUp(this)">上移学校</button>
                <button class="btn btn-move" onclick="moveDown(this)">下移学校</button>
                <button class="btn btn-delete" onclick="deleteSchool(this)">删除学校</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <tr>
                    <td>学校代码</td>
                    <td><input type="text" placeholder="（可填写）" class="school-code"></td>
                    <td>学校名称</td>
                    <td><input type="text" placeholder="（可填写）" class="school-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let schoolCount = 0;
        const MAX_SCHOOL = 36; // 最大学校数量限制
        window.onload = () => {
            addSchool();
            // 页面加载时检查URL中的分享数据并自动填充
            loadSharedData();
        };

        // 添加学校（限制最多36所）
        function addSchool() {
            if(schoolCount >= MAX_SCHOOL) {
                alert('最多只能添加 36 所学校！');
                return;
            }
            schoolCount++;
            const template = document.getElementById('schoolTemplate');
            const newSchool = template.cloneNode(true);
            newSchool.style.display = 'block';
            newSchool.id = '';
            newSchool.querySelector('.school-title').textContent = `第 ${schoolCount} 所学校`;
            document.getElementById('schoolList').appendChild(newSchool);
            
            updateAllBtnStatus();
            updateAddBtnStatus();
        }

        // 删除学校
        function deleteSchool(btn) {
            btn.closest('.school-card').remove();
            updateSchoolNumbers();
            updateAllBtnStatus();
            updateAddBtnStatus();
        }

        // 学校上下移动
        function moveUp(btn) {
            const card = btn.closest('.school-card');
            const prev = card.previousElementSibling;
            if(prev) { card.parentNode.insertBefore(card, prev); updateSchoolNumbers(); updateAllBtnStatus(); }
        }
        function moveDown(btn) {
            const card = btn.closest('.school-card');
            const next = card.nextElementSibling;
            if(next) { card.parentNode.insertBefore(next, card); updateSchoolNumbers(); updateAllBtnStatus(); }
        }

        // 专业上下移动
        function proUp(btn) {
            const row = btn.closest('.pro-row');
            const prev = row.previousElementSibling;
            if(prev?.classList.contains('pro-row')) { row.parentNode.insertBefore(row, prev); updateAllBtnStatus(); }
        }
        function proDown(btn) {
            const row = btn.closest('.pro-row');
            const next = row.nextElementSibling;
            if(next?.classList.contains('pro-row')) { row.parentNode.insertBefore(next, row); updateAllBtnStatus(); }
        }

        // 更新学校序号
        function updateSchoolNumbers() {
            const cards = document.querySelectorAll('.school-card');
            schoolCount = cards.length;
            cards.forEach((card, i) => card.querySelector('.school-title').textContent = `第 ${i+1} 所学校`);
        }

        // 更新按钮禁用状态
        function updateAllBtnStatus() {
            const cards = document.querySelectorAll('.school-card');
            cards.forEach((card, i) => {
                const [up, down] = card.querySelectorAll('.btn-move');
                up.disabled = i === 0;
                down.disabled = i === cards.length-1;
            });
            cards.forEach(card => {
                const rows = card.querySelectorAll('.pro-row');
                rows.forEach((row, j) => {
                    const [up, down] = row.querySelectorAll('.pro-btn');
                    up.disabled = j === 0;
                    down.disabled = j === rows.length-1;
                });
            });
        }

        // 更新添加按钮状态
        function updateAddBtnStatus() {
            const btn = document.getElementById('addSchoolBtn');
            btn.disabled = schoolCount >= MAX_SCHOOL;
        }

        // 清空所有
        function clearAllSchools() {
            if(confirm('确定清空所有信息？')) {
                document.getElementById('schoolList').innerHTML = '';
                schoolCount = 0;
                addSchool();
            }
        }

        // 打印
        function exportPrint() { window.print(); }

        // 收集表单数据
        function collectData() {
            const schools = [];
            document.querySelectorAll('.school-card').forEach(card => {
                const school = {
                    code: card.querySelector('.school-code').value,
                    name: card.querySelector('.school-name').value,
                    majors: []
                };
                card.querySelectorAll('.pro-row').forEach(row => {
                    school.majors.push({
                        num: row.querySelector('.pro-num').value,
                        name: row.querySelector('.pro-name').value
                    });
                });
                schools.push(school);
            });
            return schools;
        }

        // 通用下载方法
        function downloadFile(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 100);
        }

        // ===================== Word导出 扁平化无黑线 + A4横向 一页4校 =====================
        function exportAsWord() {
            const content = collectData();
            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
                <meta charset="utf-8">
                <title>志愿填报信息表</title>
                <style>
                    /* 页面设置：A4 横向 */
                    @page WordSection1 {
                        size: A4 landscape;
                        margin: 2cm;
                    }
                    body { 
                        font-family: "Microsoft YaHei"; 
                        margin: 0;
                        padding: 0;
                        font-size: 10.5pt;
                        color: #333;
                    }
                    h1 { 
                        text-align: center; 
                        margin-bottom: 25px; 
                        font-size: 14pt;
                        font-weight: bold;
                        color: #000;
                    }
                    /* 外层布局：2列表格，无框线，实现2*2排版 */
                    .outer-table {
                        width: 100%;
                        border: none;
                        border-collapse: collapse;
                    }
                    .outer-td {
                        width: 50%;
                        vertical-align: top;
                        padding: 0 1.2cm;
                        border: none;
                    }
                    /* 单个学校区块：纯扁平化，无任何边框 */
                    .school-wrap {
                        margin-bottom: 22px;
                        padding-bottom: 15px;
                        border-bottom: 1px solid #eee; /* 极浅分割线，不突兀，可删除 */
                    }
                    .school-title {
                        font-size: 11pt;
                        font-weight: bold;
                        margin-bottom: 8px;
                        color: #222;
                    }
                    .info-line {
                        margin: 4px 0;
                        line-height: 1.4;
                    }
                    .major-line {
                        margin: 3px 0;
                        line-height: 1.4;
                        padding-left: 6px;
                    }
                    /* 分页：每4所学校新起一页 */
                    .page-break {
                        page-break-before: always;
                    }
                </style>
            </head>
            <body>
                <h1>志愿填报信息表</h1>
                <table class="outer-table">
                    <tr>
                        <td class="outer-td">
            `;
            
            const pageSize = 4; // 每页固定4所学校
            for (let pageStart = 0; pageStart < content.length; pageStart += pageSize) {
                const pageSchools = content.slice(pageStart, pageStart + pageSize);
                const col1 = pageSchools.slice(0, 2);  // 左列2所
                const col2 = pageSchools.slice(2, 4);  // 右列2所

                // 渲染左列学校
                col1.forEach((school, idx) => {
                    const num = pageStart + idx + 1;
                    html += `
                    <div class="school-wrap">
                        <div class="school-title">第${num}所学校</div>
                        <div class="info-line">学校代码：${school.code || ''}</div>
                        <div class="info-line">学校名称：${school.name || ''}</div>
                    `;
                    school.majors.forEach(major => {
                        html += `<div class="major-line">${major.num || ''}　${major.name || ''}</div>`;
                    });
                    html += `</div>`;
                });

                html += `
                        </td>
                        <td class="outer-td">
                `;

                // 渲染右列学校
                col2.forEach((school, idx) => {
                    const num = pageStart + idx + 3;
                    html += `
                    <div class="school-wrap">
                        <div class="school-title">第${num}所学校</div>
                        <div class="info-line">学校代码：${school.code || ''}</div>
                        <div class="info-line">学校名称：${school.name || ''}</div>
                    `;
                    school.majors.forEach(major => {
                        html += `<div class="major-line">${major.num || ''}　${major.name || ''}</div>`;
                    });
                    html += `</div>`;
                });

                html += `
                        </td>
                    </tr>
                    ${(pageStart + pageSize < content.length) ? '<tr class="page-break"></tr>' : ''}
                `;
            }
            
            html += `
                </table>
            </body>
            </html>
            `;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            downloadFile(blob, '志愿填报信息表.doc');
        }

        // ===================== 新增分享功能核心代码 =====================
        // 生成分享链接并提供分享选项
        function shareData() {
            const data = collectData();
            // 1. 序列化数据为JSON并编码
            const jsonData = JSON.stringify(data);
            const encodedData = encodeURIComponent(jsonData);
            
            // 2. 构建分享URL（当前页面URL + 数据参数）
            const currentUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${currentUrl}?data=${encodedData}`;
            
            // 3. 复制链接到剪贴板
            navigator.clipboard.writeText(shareUrl).then(() => {
                // 4. 尝试使用系统原生分享API（支持移动设备和现代浏览器）
                if (navigator.share) {
                    navigator.share({
                        title: '志愿填报信息表',
                        text: '我分享了一份志愿填报信息表，点击链接查看',
                        url: shareUrl
                    }).catch(err => {
                        alert('链接已复制到剪贴板，你可以手动分享给他人');
                    });
                } else {
                    alert('链接已复制到剪贴板，你可以手动分享给他人');
                }
            }).catch(err => {
                alert('复制失败，请手动复制链接：\n' + shareUrl);
            });
        }

        // 加载分享数据并自动填充表单
        function loadSharedData() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                try {
                    // 解码并解析JSON数据
                    const jsonData = decodeURIComponent(encodedData);
                    const data = JSON.parse(jsonData);
                    
                    if (confirm('检测到分享数据，是否加载？')) {
                        // 清空现有内容
                        document.getElementById('schoolList').innerHTML = '';
                        schoolCount = 0;
                        
                        // 填充数据
                        data.forEach(schoolData => {
                            addSchool();
                            const currentCard = document.querySelectorAll('.school-card')[schoolCount - 1];
                            
                            // 填充学校信息
                            currentCard.querySelector('.school-code').value = schoolData.code || '';
                            currentCard.querySelector('.school-name').value = schoolData.name || '';
                            
                            // 填充专业信息
                            const proRows = currentCard.querySelectorAll('.pro-row');
                            schoolData.majors.forEach((major, idx) => {
                                if (idx < proRows.length) {
                                    proRows[idx].querySelector('.pro-num').value = major.num || '';
                                    proRows[idx].querySelector('.pro-name').value = major.name || '';
                                }
                            });
                        });
                        
                        updateAllBtnStatus();
                        updateAddBtnStatus();
                    }
                } catch (err) {
                    console.error('解析分享数据失败:', err);
                    alert('分享链接无效或已损坏');
                }
            }
        }

        // 导出Excel（按钮已移除，代码保留）
        function escapeCSV(text) {
            return text.includes(',') || text.includes('"') || text.includes('\n') ? `"${text.replace(/"/g, '""')}"` : text;
        }
        function exportAsExcel() {}

        // 导出PDF（按钮已移除，代码保留）
        function replaceInputsWithStaticText(container) {
            const inputReplacements = [];
            const inputs = container.querySelectorAll('input');
            inputs.forEach(input => {
                const staticDiv = document.createElement('div');
                staticDiv.className = 'static-text';
                staticDiv.textContent = input.value || input.placeholder;
                staticDiv.style.fontSize = window.getComputedStyle(input).fontSize;
                staticDiv.style.color = window.getComputedStyle(input).color;
                staticDiv.style.padding = window.getComputedStyle(input).padding;
                inputReplacements.push({
                    original: input,
                    replacement: staticDiv,
                    parent: input.parentNode
                });
                input.parentNode.replaceChild(staticDiv, input);
            });
            return inputReplacements;
        }
        function restoreInputsFromStaticText(replacements) {
            replacements.forEach(item => {
                item.parent.replaceChild(item.original, item.replacement);
            });
        }
        async function exportAsPDF() {}
    </script>
