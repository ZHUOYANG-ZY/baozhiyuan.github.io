<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>志愿填报信息表</title>
    <!-- 引入PDF导出依赖库（CDN，首次使用需联网加载） -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f4f8;
            padding: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 22px;
        }
        .btn-group {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .btn-add { background-color: #38a169; color: white; }
        .btn-clear { background-color: #ed8936; color: white; }
        .btn-preview { background-color: #805ad5; color: white; }
        .btn-print { background-color: #d69e2e; color: white; }
        .btn-delete { background-color: #e53e3e; color: white; }
        .btn-export { background-color: #38b2ac; color: white; }
        .btn-pdf { background-color: #2563eb; color: white; }

        .btn-move {
            padding: 8px 12px;
            font-size: 14px;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-move:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .pro-btn {
            padding: 6px 8px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            background-color: #48bb78;
            color: white;
            cursor: pointer;
        }
        .pro-btn:disabled { background-color: #a0aec0; }

        .school-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            background-color: #2b6cb0;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .card-header h3 {
            font-size: 18px;
        }
        .button-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .table-wrapper {
            overflow-x: auto;
            padding: 15px;
        }
        table {
            width: 100%;
            min-width: 320px;
            border-collapse: collapse;
            border: 1px solid #333;
        }
        td {
            border: 1px solid #333;
            padding: 12px 8px;
            vertical-align: middle;
            font-size: 16px;
        }
        td:nth-child(1) { width: 22%; text-align: center; }
        td:nth-child(2) { width: 26%; }
        td:nth-child(3) { width: 22%; text-align: center; }
        td:nth-child(4) { width: 30%; }

        input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }
        input::placeholder {
            color: #a0aec0;
            font-size: 15px;
        }

        /* 打印样式 */
        @media print {
            body { background: white; padding: 0; }
            .btn-group, .button-container, .pro-btn { display: none !important; }
            .school-card { box-shadow: none; page-break-inside: avoid; }
        }
        #schoolTemplate { display: none; }

        /* 手机端专属适配 */
        @media (max-width: 768px) {
            body { padding: 5px; }
            h1 { font-size: 26px; margin: 10px 0; }
            .btn-group {
                flex-direction: column;
                gap: 8px;
                padding: 0 5px;
            }
            .btn {
                width: 100%;
                padding: 18px 0;
                font-size: 18px;
                border-radius: 10px;
            }
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                padding: 15px 10px;
            }
            .card-header h3 {
                font-size: 20px;
                width: 100%;
            }
            .button-container {
                width: 100%;
                justify-content: space-between;
            }
            .btn-move, .btn-delete {
                flex: 1;
                padding: 12px 0;
                font-size: 16px;
                text-align: center;
            }
            .table-wrapper { padding: 10px 5px; }
            td {
                padding: 15px 5px;
                font-size: 18px;
            }
            input {
                font-size: 18px;
            }
            input::placeholder {
                font-size: 16px;
            }
            .pro-btn {
                padding: 10px 5px;
                font-size: 16px;
                width: 100%;
                margin: 2px 0;
            }
        }
    </style>
</head>
<body>
    <h1>志愿填报信息表</h1>
    <div class="btn-group">
        <button class="btn btn-add" onclick="addSchool()">+ 添加学校</button>
        <button class="btn btn-clear" onclick="clearAllSchools()">清空所有</button>
        <button class="btn btn-preview" onclick="openPreview()">预览</button>
        <button class="btn btn-print" onclick="exportPrint()">导出打印</button>
        <button class="btn btn-export" onclick="exportAsWord()">导出 Word</button>
        <button class="btn btn-export" onclick="exportAsExcel()">导出 Excel</button>
        <button class="btn btn-pdf" onclick="exportAsPDF()">导出 PDF</button>
    </div>

    <div id="schoolList"></div>

    <!-- 学校模板 -->
    <div id="schoolTemplate" class="school-card">
        <div class="card-header">
            <h3 class="school-title">第 1 所学校</h3>
            <div class="button-container">
                <button class="btn btn-move" onclick="moveUp(this)">上移学校</button>
                <button class="btn btn-move" onclick="moveDown(this)">下移学校</button>
                <button class="btn btn-delete" onclick="deleteSchool(this)">删除学校</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <tr>
                    <td>学校代码</td>
                    <td><input type="text" placeholder="（可填写）" class="school-code"></td>
                    <td>学校名称</td>
                    <td><input type="text" placeholder="（可填写）" class="school-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
                <tr class="pro-row">
                    <td>
                        <button class="pro-btn" onclick="proUp(this)">上移</button><br>
                        <button class="pro-btn" onclick="proDown(this)">下移</button>
                    </td>
                    <td><input type="text" placeholder="专业序号" class="pro-num"></td>
                    <td colspan="2"><input type="text" placeholder="专业名字" class="pro-name"></td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;
        let schoolCount = 0;
        window.onload = () => addSchool();

        // 添加学校
        function addSchool() {
            schoolCount++;
            const template = document.getElementById('schoolTemplate');
            const newSchool = template.cloneNode(true);
            newSchool.style.display = 'block';
            newSchool.id = '';
            newSchool.querySelector('.school-title').textContent = `第 ${schoolCount} 所学校`;
            document.getElementById('schoolList').appendChild(newSchool);
            updateAllBtnStatus();
        }

        // 删除学校
        function deleteSchool(btn) {
            btn.closest('.school-card').remove();
            updateSchoolNumbers();
            updateAllBtnStatus();
        }

        // 学校上下移动
        function moveUp(btn) {
            const card = btn.closest('.school-card');
            const prev = card.previousElementSibling;
            if(prev) { card.parentNode.insertBefore(card, prev); updateSchoolNumbers(); updateAllBtnStatus(); }
        }
        function moveDown(btn) {
            const card = btn.closest('.school-card');
            const next = card.nextElementSibling;
            if(next) { card.parentNode.insertBefore(next, card); updateSchoolNumbers(); updateAllBtnStatus(); }
        }

        // 专业上下移动
        function proUp(btn) {
            const row = btn.closest('.pro-row');
            const prev = row.previousElementSibling;
            if(prev?.classList.contains('pro-row')) { row.parentNode.insertBefore(row, prev); updateAllBtnStatus(); }
        }
        function proDown(btn) {
            const row = btn.closest('.pro-row');
            const next = row.nextElementSibling;
            if(next?.classList.contains('pro-row')) { row.parentNode.insertBefore(next, row); updateAllBtnStatus(); }
        }

        // 更新学校序号
        function updateSchoolNumbers() {
            const cards = document.querySelectorAll('.school-card');
            schoolCount = cards.length;
            cards.forEach((card, i) => card.querySelector('.school-title').textContent = `第 ${i+1} 所学校`);
        }

        // 更新按钮禁用状态
        function updateAllBtnStatus() {
            const cards = document.querySelectorAll('.school-card');
            cards.forEach((card, i) => {
                const [up, down] = card.querySelectorAll('.btn-move');
                up.disabled = i === 0;
                down.disabled = i === cards.length-1;
            });
            cards.forEach(card => {
                const rows = card.querySelectorAll('.pro-row');
                rows.forEach((row, j) => {
                    const [up, down] = row.querySelectorAll('.pro-btn');
                    up.disabled = j === 0;
                    down.disabled = j === rows.length-1;
                });
            });
        }

        // 清空所有
        function clearAllSchools() {
            if(confirm('确定清空所有信息？')) {
                document.getElementById('schoolList').innerHTML = '';
                schoolCount = 0;
                addSchool();
            }
        }

        // 预览页面
        function openPreview() {
            const win = window.open('', '_blank', 'width=1000,height=800');
            const content = document.getElementById('schoolList').cloneNode(true);
            content.querySelectorAll('.button-container, .pro-btn').forEach(el => el.remove());
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>预览</title>
                    <style>
                        *{font-family:Microsoft YaHei;}
                        body{padding:20px;}
                        h1{text-align:center;}
                        table{width:100%;border-collapse:collapse;}
                        td{border:1px solid #333;padding:15px;font-size:18px;}
                        input{border:none;outline:none;font-size:18px;width:100%;}
                    </style>
                </head>
                <body>
                    <h1>志愿填报信息表</h1>
                    ${content.innerHTML}
                </body>
                </html>
            `);
            win.document.close();
        }

        // 打印
        function exportPrint() { window.print(); }

        // 收集全部表单数据
        function collectData() {
            const schools = [];
            document.querySelectorAll('.school-card').forEach(card => {
                const school = {
                    code: card.querySelector('.school-code').value,
                    name: card.querySelector('.school-name').value,
                    majors: []
                };
                card.querySelectorAll('.pro-row').forEach(row => {
                    school.majors.push({
                        num: row.querySelector('.pro-num').value,
                        name: row.querySelector('.pro-name').value
                    });
                });
                schools.push(school);
            });
            return schools;
        }

        // 通用文件下载方法
        function downloadFile(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 100);
        }

        // 导出 Word 文档
        function exportAsWord() {
            const content = collectData();
            let html = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="utf-8"><title>志愿填报信息表</title></head>
            <body style="font-family:Microsoft YaHei;">
                <h1 style="text-align:center;">志愿填报信息表</h1>
                <div style="margin:20px 0;">
            `;
            content.forEach((school, idx) => {
                html += `
                <h2>第${idx+1}所学校</h2>
                <p><strong>学校代码：</strong>${school.code || '未填写'}</p>
                <p><strong>学校名称：</strong>${school.name || '未填写'}</p>
                <h3>专业志愿</h3>
                <table border="1" style="border-collapse:collapse;width:100%;margin:10px 0;">
                    <tr style="background-color:#f0f0f0;">
                        <th style="padding:8px;">专业序号</th>
                        <th style="padding:8px;">专业名称</th>
                    </tr>
                `;
                school.majors.forEach(major => {
                    html += `
                    <tr>
                        <td style="padding:8px;">${major.num || '未填写'}</td>
                        <td style="padding:8px;">${major.name || '未填写'}</td>
                    </tr>
                    `;
                });
                html += `</table><hr style="margin:20px 0;">`;
            });
            html += `</div></body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            downloadFile(blob, '志愿填报信息表.doc');
        }

        // 导出 Excel(CSV)
        function escapeCSV(text) {
            return text.includes(',') || text.includes('"') || text.includes('\n') ? `"${text.replace(/"/g, '""')}"` : text;
        }
        function exportAsExcel() {
            const content = collectData();
            let csv = '学校序号,学校代码,学校名称,专业序号,专业名称\n';
            content.forEach((school, sIdx) => {
                school.majors.forEach((major) => {
                    csv += `${sIdx+1},${escapeCSV(school.code)},${escapeCSV(school.name)},${escapeCSV(major.num)},${escapeCSV(major.name)}\n`;
                });
            });
            const blob = new Blob(['\ufeff', csv], { type: 'text/csv;charset=utf-8;' });
            downloadFile(blob, '志愿填报信息表.csv');
        }

        // 新增：导出 PDF
        async function exportAsPDF() {
            try {
                // 克隆页面内容，移除所有操作按钮
                const cloneDom = document.getElementById('schoolList').cloneNode(true);
                cloneDom.querySelectorAll('.button-container, .pro-btn').forEach(el => el.remove());
                
                // 创建临时容器用于渲染PDF
                const tempBox = document.createElement('div');
                tempBox.style.position = 'absolute';
                tempBox.style.left = '-9999px';
                tempBox.style.top = '0';
                tempBox.style.width = '800px';
                tempBox.style.background = '#fff';
                document.body.appendChild(tempBox);

                const title = document.createElement('h1');
                title.style.textAlign = 'center';
                title.style.marginBottom = '20px';
                title.style.fontFamily = 'Microsoft YaHei';
                title.innerText = '志愿填报信息表';
                tempBox.appendChild(title);
                tempBox.appendChild(cloneDom);

                // 转图片并生成PDF
                const canvas = await html2canvas(tempBox, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff'
                });
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: 'p',
                    unit: 'mm',
                    format: 'a4'
                });
                const imgWidth = 210;
                const imgHeight = canvas.height * imgWidth / canvas.width;

                // 自动分页
                let heightLeft = imgHeight;
                let position = 0;
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= 297;

                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= 297;
                }

                // 下载PDF
                pdf.save('志愿填报信息表.pdf');
                // 移除临时DOM
                document.body.removeChild(tempBox);
            } catch (err) {
                alert('PDF导出失败，请检查网络或更换浏览器重试');
                console.error(err);
            }
        }
    </script>
</body>
</html>
